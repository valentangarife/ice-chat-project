plugins {
    id 'java-library'
}

// Ruta de slice2java: usa la de Homebrew si existe (para que funcione tambien desde IntelliJ)
def slice2javaCmd = file('/opt/homebrew/bin/slice2java').exists() ? '/opt/homebrew/bin/slice2java' : 'slice2java'

// Tarea para compilar Slice a Java antes de compilar el codigo fuente
tasks.register('compileSlice', Exec) {
    description = 'Compila Chat.ice a codigo fuente Java usando slice2java'
    doFirst {
        file("src/main/java").mkdirs()
    }
    // Invoca la utilidad nativa slice2java de ZeroC
    commandLine slice2javaCmd, '--output-dir', 'src/main/java', 'src/main/slice/Chat.ice'
}

// Asegura que Java dependa de la generacion previa del codigo de Slice
tasks.named('compileJava') {
    dependsOn 'compileSlice'
}
